name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Prepare candidate directory
        run: mkdir -p "$RUNNER_TEMP/release-assets"
      - run: npm run release:check
        env:
          RELEASE_TARBALL_OUT: ${{ runner.temp }}/release-assets/geoptimize-${{ matrix.node-version }}.tgz
          RELEASE_MANIFEST_OUT: ${{ runner.temp }}/release-candidate-node-${{ matrix.node-version }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/release-candidate-node-${{ matrix.node-version }}.json
          if-no-files-found: error

      - name: Prepare release artifacts and exercise non-publishing path
        if: matrix.node-version == 24
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          cp "$RUNNER_TEMP/release-candidate-node-24.json" "$RUNNER_TEMP/release-assets/candidate.json"
          mv "$RUNNER_TEMP/release-assets/geoptimize-24.tgz" "$RUNNER_TEMP/release-assets/geoptimize-$version.tgz"
          node scripts/prepare-release-artifacts.mjs "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check SHA256SUMS)
          npm publish "$RUNNER_TEMP/release-assets/geoptimize-$version.tgz" --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node-version == 24
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error

  release-candidate-reproducibility:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-candidate-node-*
          path: release-candidates
          merge-multiple: true
      - name: Require byte-identical Node 22 and Node 24 candidates
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('release-candidates').sort();
          if (files.length !== 2) throw new Error(`expected two candidate manifests, found ${files.length}`);
          const manifests = files.map((file) => JSON.parse(fs.readFileSync(path.join('release-candidates', file), 'utf8')));
          for (const field of ['version', 'filename', 'sha256', 'fileCount', 'unpackedSize']) {
            if (manifests[0][field] !== manifests[1][field]) {
              throw new Error(`${field} differs across Node 22 and Node 24 candidates`);
            }
          }
          console.log(`reproducible candidate ${manifests[0].filename} sha256=${manifests[0].sha256}`);
          NODE

  lint-readme-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Verify CLI is callable as geoptimize
        run: node dist/cli/index.js --version
      - name: Verify public metadata uses the current repository owner
        run: npm test -- --run src/core/__tests__/evidence-boundaries.test.ts

  action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm pack

      - name: Advisory mode is the default
        id: advisory
        uses: ./
        with:
          path: .github/fixtures/action-low
          min-score: '100'
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Validate Action outputs
        env:
          SCORE: ${{ steps.advisory.outputs.score }}
          REPORT: ${{ steps.advisory.outputs.report }}
        run: |
          case "$SCORE" in
            ''|*[!0-9]*) echo "Invalid score output: $SCORE"; exit 1 ;;
          esac
          node -e "const r=JSON.parse(process.env.REPORT);if(r.overall.total!==Number(process.env.SCORE))process.exit(1)"

      - name: Run the sample site through the local composite Action
        id: sample
        uses: ./
        with:
          path: examples/github-action-sample/site
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Validate sample outputs
        env:
          SCORE: ${{ steps.sample.outputs.score }}
          REPORT: ${{ steps.sample.outputs.report }}
        run: |
          case "$SCORE" in
            ''|*[!0-9]*) echo "Invalid sample score: $SCORE"; exit 1 ;;
          esac
          node -e "const r=JSON.parse(process.env.REPORT);if(r.pages.length!==1||r.overall.total!==Number(process.env.SCORE))process.exit(1)"

      - name: Blocking mode passes at an accepted threshold
        id: blocking-passes
        uses: ./
        with:
          path: .github/fixtures/action-low
          min-score: '0'
          fail-on-low-score: 'true'
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Validate blocking outputs
        env:
          SCORE: ${{ steps.blocking-passes.outputs.score }}
          REPORT: ${{ steps.blocking-passes.outputs.report }}
        run: |
          case "$SCORE" in
            ''|*[!0-9]*) echo "Invalid score output: $SCORE"; exit 1 ;;
          esac
          node -e "const r=JSON.parse(process.env.REPORT);if(r.overall.total!==Number(process.env.SCORE))process.exit(1)"

      - name: Blocking mode fails below threshold
        id: blocking-fails
        continue-on-error: true
        uses: ./
        with:
          path: .github/fixtures/action-low
          min-score: '100'
          fail-on-low-score: 'true'
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Invalid choice is rejected
        id: invalid-choice
        continue-on-error: true
        uses: ./
        with:
          path: .github/fixtures/action-low
          fail-on-low-score: sometimes
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Out-of-range threshold is rejected
        id: invalid-threshold
        continue-on-error: true
        uses: ./
        with:
          path: .github/fixtures/action-low
          min-score: '101'
          package-spec: ./geoptimize-0.9.0.tgz

      - name: Assert expected failures
        env:
          BLOCKING_OUTCOME: ${{ steps.blocking-fails.outcome }}
          INVALID_OUTCOME: ${{ steps.invalid-choice.outcome }}
          THRESHOLD_OUTCOME: ${{ steps.invalid-threshold.outcome }}
        run: |
          test "$BLOCKING_OUTCOME" = failure
          test "$INVALID_OUTCOME" = failure
          test "$THRESHOLD_OUTCOME" = failure
