name: geoptimize Content Readiness Check
description: Run the deterministic geoptimize readiness lint against a build directory
author: Te-Shu Wang
branding:
  icon: search
  color: blue

inputs:
  path:
    description: Build output directory to scan
    required: true
    default: dist
  min-score:
    description: Project-specific readiness threshold from 0 to 100
    required: false
    default: '60'
  fail-on-low-score:
    description: Choose blocking mode and fail when the readiness score is below min-score
    required: false
    default: 'false'
  package-spec:
    description: npm package spec to install; keep the default outside prerelease testing
    required: false
    default: 'geoptimize@0.7.0'

outputs:
  score:
    description: Deterministic readiness score from 0 to 100
    value: ${{ steps.scan.outputs.score }}
  report:
    description: JSON readiness report
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install geoptimize
      shell: bash
      env:
        PACKAGE_SPEC: ${{ inputs.package-spec }}
      run: npm install --global "$PACKAGE_SPEC"

    - name: Run readiness scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        MIN_SCORE: ${{ inputs.min-score }}
        FAIL_ON_LOW_SCORE: ${{ inputs.fail-on-low-score }}
      run: bash "${{ github.action_path }}/action/run.sh"
