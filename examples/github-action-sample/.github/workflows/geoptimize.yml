name: Content readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cucuwang/geoptimize@v0.9.0
        with:
          path: site
          fail-on-low-score: 'false'
